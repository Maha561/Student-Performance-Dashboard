
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Performance Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Student Performance Dashboard</h1>

<button id="lightBtn">Light</button>
<button id="darkBtn">Dark</button>

<br><br>

<!-- Dashboard -->

<h2>Dashboard</h2>

<div class="dashboard">

<div class="card">
<h3>Total Students</h3>
<p id="totalStudents">0</p>
</div>

<div class="card">
<h3>Passed Students</h3>
<p id="passedStudents">0</p>
</div>

<div class="card">
<h3>Failed Students</h3>
<p id="failedStudents">0</p>
</div>

</div>

<!-- Add Student -->

<h2>Add Student</h2>

<form id="studentForm">

<label>Name</label>
<input type="text" id="name" required>

<label>Department</label>
<input type="text" id="dept" required>

<label>Marks</label>
<input type="number" id="marks" required>

<button type="submit">Add Student</button>

</form>

<br>

<!-- Department Filter -->

<center>

<label><b>Filter by Department</b></label>

<select id="deptFilter" onchange="filterDepartment()">

<option value="All">All</option>
<option value="CSE">CSE</option>
<option value="IT">IT</option>
<option value="ECE">ECE</option>

</select>

</center>

<br>

<!-- Search -->

<div class="searchBox">

<label><b>Search Student</b></label>

<input type="text" id="searchInput" placeholder="Enter name" onkeyup="searchStudent()">

</div>

<!-- Student Table -->

<h2>Student List</h2>

<table>

<thead>

<tr>
<th>Name</th>
<th>Department</th>
<th>Marks</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

<script src="script.js"></script>

</body>

</html>
