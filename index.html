<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Performance Dashboard</title>

<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- 🔷 NAVBAR -->
<div class="navbar">

    <h2 class="logo">Student Dashboard</h2>

    <div class="nav-actions">

        <!-- Search -->
        <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchStudent()">

        <!-- Filter -->
        <select id="deptFilter" onchange="filterDepartment()">
            <option value="All">All Dept</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
        </select>

        <!-- Add -->
        <a href="add.html">
            <button>Add</button>
        </a>

        <!-- Theme -->
        <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>

        <!-- Logout -->
        <button onclick="logout()">Logout</button>

    </div>

</div>

<!-- 🔷 TITLE -->
<h1 style="text-align:center; margin-top:20px;">
    Student Performance Dashboard
</h1>

<!-- 🔷 DASHBOARD -->
<h2>Dashboard</h2>

<div class="dashboard">

<div class="card">
<h3>Total Students</h3>
<p id="totalStudents">0</p>
</div>

<div class="card">
<h3>Passed Students</h3>
<p id="passedStudents">0</p>
</div>

<div class="card">
<h3>Failed Students</h3>
<p id="failedStudents">0</p>
</div>

</div>

<!-- 🔷 TABLE -->
<h2>Student List</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Department</th>
<th>Marks</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentTable">
</tbody>

</table>

<!-- 🔷 CHART -->
<h2 style="text-align:center;">Analytics</h2>

<div class="chartBox">
    <canvas id="myChart"></canvas>
</div>

<script src="script.js"></script>

</body>

</html>
